name: Release frs CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked

  build:
    name: Build ${{ matrix.asset }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: frs-linux-x64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: frs-macos-x64
          - os: macos-15
            target: aarch64-apple-darwin
            asset: frs-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: frs-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --package frs-cli --target ${{ matrix.target }}
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/frs dist/frs
          tar -C dist -czf ${{ matrix.asset }}.tar.gz frs
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/frs.exe" dist/frs.exe
          Compress-Archive -Path dist/frs.exe -DestinationPath "${{ matrix.asset }}.zip" -Force
          # A tar archive as well, so `frs update` can unpack every platform
          # the same way.
          tar -C dist -czf ${{ matrix.asset }}.tar.gz frs.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: frs-*
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum frs-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/frs-*
            dist/SHA256SUMS

  # Publishes the crates to crates.io. The job is skipped when the registry
  # token is not configured, so a fork can still cut a release.
  publish-crate:
    name: Publish crates to crates.io
    needs: build
    if: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish fragment-macros
        run: cargo publish --package fragment-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for crates.io to index the macros
        run: sleep 60
      - name: Publish fragment-rs
        run: cargo publish --package fragment-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for crates.io to index the framework
        run: sleep 60
      - name: Publish frs-cli
        run: cargo publish --package frs-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
