[package]
name = "fragment-rs"
version = "0.2.0"
edition = "2021"
authors = ["Fragment Team <team@fragment.rs>"]
description = """A Spring Boot-inspired web framework for Rust powered by Axum. Zero config, zero manual registration. Auto DI, validation, and OpenAPI docs."""
license = "MIT OR Apache-2.0"
keywords = ["web", "axum", "framework", "api", "rust"]
categories = ["async", "web-programming::http-server"]
readme = "../README.md"

[dependencies]
fragment-macros = { path = "../fragment-macros", version = "0.2.0" }
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
validator = { version = "0.18", features = ["derive"] }
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"

[dev-dependencies]
http = "1"
tower = "0.4"
tempfile = "3"

[[example]]
name = "quickstart_demo"
path = "../examples/quickstart.rs"
